services:
  postgres:
    image: postgres:15
    container_name: gym_postgres
    restart: always
    environment:
      POSTGRES_DB: gym_db
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
